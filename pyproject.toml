[project]
name = "claimpilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27",
    "google-genai>=1.0",
    "pymupdf>=1.24",
    "pillow>=10",
    "numpy>=1.26",
    "chromadb>=1.0",
    "xgboost>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "langgraph>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "data*"]
